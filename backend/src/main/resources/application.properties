spring.application.name=foodie-backend
server.port=8080

# DataSource configuration
# Defaults to in-memory H2 with MySQL syntax compatibility.
# For production or MySQL local service, set DATABASE_URL,
# DATABASE_USERNAME and DATABASE_PASSWORD as environment variables.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/foodiedb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Token Secret & Expiration
# IMPORTANT: Keep JWT_SECRET in environment variables.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

# Logging
logging.level.com.foodiefindings=INFO